[workspace]
members = ["crates/yeomna-chunking", "crates/yeomna-keys", "crates/yeomna-batch", "crates/yeomna-proto", "crates/yeomna-embed"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# let-chains (used in yeomna-batch) stabilized in 1.88.
rust-version = "1.88"

[workspace.dependencies]
# Versions match the reference's root manifest where a pin exists there.
regex = "1"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
tempfile = "3"
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.13"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = { version = "0.9", features = ["client"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
