[workspace]
members = ["crates/yeomna-chunking", "crates/yeomna-keys", "crates/yeomna-batch", "crates/yeomna-proto", "crates/yeomna-embed", "crates/yeomna-code", "crates/yeomna-pipeline", "crates/yeomna-store", "crates/yeomna-verbs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# let-chains (used in yeomna-batch) stabilized in 1.88.
rust-version = "1.88"

[workspace.dependencies]
# Versions match the reference's root manifest where a pin exists there.
regex = "1"
# Tree walking with .gitignore semantics, for the codebase ingest walk (spec 011).
ignore = "0.4"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# with-chrono-0_4 so timestamptz round-trips as a real type rather
# than being formatted into a string in SQL (spec 012).
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
anyhow = "1"
tempfile = "3"
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.13"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = { version = "0.9", features = ["client"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# Code analysis. Grammar pins are behavior: a grammar bump changes parses,
# which changes symbols, which changes derived keys (spec 004).
clang = { version = "2.0", features = ["clang_10_0", "runtime"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
rustpython-parser = "0.4"
syn = { version = "2", features = ["full", "visit"] }
tree-sitter = "=0.26.11"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
url = "2"
