# Yeomna Extraction Service Configuration
# Install to /etc/yeomna/extractor.conf
# This file is sourced by the systemd unit via EnvironmentFile=

# GPU visibility — restricts PyTorch to ONLY these GPUs at the CUDA driver
# level. GPU 2 becomes cuda:0 inside the process. This is the effective device
# control: the backend has no application-level device setting.
CUDA_VISIBLE_DEVICES=2

# Socket path
YEOMNA_EXTRACTOR_SOCKET=/run/yeomna/extractor.sock

# Enable OCR for scanned PDFs (slower, higher accuracy)
YEOMNA_EXTRACTOR_OCR=false

# Idle timeout in seconds — unload Docling VLM from VRAM after idle.
# Set to 0 to disable idle unloading.
YEOMNA_EXTRACTOR_IDLE_TIMEOUT=900

# PyMuPDF fallback if Docling fails
YEOMNA_EXTRACTOR_FALLBACK=true

# HuggingFace cache (ProtectHome=read-only blocks ~/.cache)
HF_HOME=/var/cache/yeomna/huggingface
TRANSFORMERS_CACHE=/var/cache/yeomna/huggingface

# PyTorch memory management
PYTORCH_ALLOC_CONF=expandable_segments:True
