# Creates the runtime socket directory for Yeomna services.
# Install to /etc/tmpfiles.d/yeomna.conf
# Deliberately the ONLY creator of /run/yeomna: units must not declare
# RuntimeDirectory=yeomna, because systemd removes a unit's RuntimeDirectory
# on stop, which would unlink sibling services' live sockets (the reference
# observed exactly this failure on 2026-07-20).
d /run/yeomna 0770 yeomna yeomna -
