[package]
name = "yeomna-cli"
description = "The appliance's command surface: one verb request in, one envelope out"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "yeomna"
path = "src/main.rs"

[dependencies]
yeomna-verbs = { path = "../yeomna-verbs" }
yeomna-store = { path = "../yeomna-store" }
# H8: the same resolver the ingest preflight uses.
yeomna-code = { path = "../yeomna-code" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The framed transport's other end, so `--daemon` is tested against the
# server it talks to rather than a mock of it.
yeomna-daemon = { path = "../yeomna-daemon" }
