[package]
name = "yeomna-verbs"
description = "The verb contract: the closed vocabulary, requests, envelope, and errors, per spec 010"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The session's one-call-at-a-time lock (tokio::sync::Mutex).
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
yeomna-store = { path = "../yeomna-store" }
# The ingestion verbs wrap the orchestrators rather than reimplementing
# them (spec 019). No cycle: the pipeline knows nothing of the verbs.
yeomna-pipeline = { path = "../yeomna-pipeline" }
yeomna-chunking = { path = "../yeomna-chunking" }
yeomna-embed = { path = "../yeomna-embed" }
# retire turns a path back into the key the graph stores it under.
yeomna-keys = { path = "../yeomna-keys" }

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
