[package]
name = "yeomna-verbs"
description = "The verb contract: the closed vocabulary, requests, envelope, and errors, per spec 010"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The MCP front end derives its tool schemas from this crate's types
# (spec 024 D5).
#
# It is off by default so a consumer that builds this crate alone does not
# pull schemars in. **It does not keep schemars out of the CLI or the
# daemon**, and the first draft of this comment claimed it did. Cargo
# unifies features across the members of one build, so under the
# documented gate (`cargo build`, `cargo test --workspace`) this crate
# compiles once with `schema` on and every binary in the workspace links
# schemars. `cargo tree --workspace -i schemars` says so plainly. Keeping
# them apart would take a separate crate for the derives, which is not
# worth a build-time dependency.
schema = ["dep:schemars"]

[dependencies]
chrono.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The session's one-call-at-a-time lock (tokio::sync::Mutex).
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
yeomna-store = { path = "../yeomna-store" }
# The ingestion verbs wrap the orchestrators rather than reimplementing
# them (spec 019). No cycle: the pipeline knows nothing of the verbs.
yeomna-pipeline = { path = "../yeomna-pipeline" }
yeomna-chunking = { path = "../yeomna-chunking" }
yeomna-embed = { path = "../yeomna-embed" }
# retire turns a path back into the key the graph stores it under.
yeomna-keys = { path = "../yeomna-keys" }

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
