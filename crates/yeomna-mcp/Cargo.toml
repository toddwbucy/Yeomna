[package]
name = "yeomna-mcp"
description = "The MCP front end: the verb contract as model-controlled tools over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "yeomna-mcp"
path = "src/main.rs"

[lib]
name = "yeomna_mcp"
path = "src/lib.rs"

[dependencies]
# The contract, for its types and their doc comments. Schemas only: this
# crate never executes a verb (D3).
yeomna-verbs = { path = "../yeomna-verbs", features = ["schema"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
